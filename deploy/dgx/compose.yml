# amjad: the site at amjad.haslani.com. Host: DGX, folder /home/admin/claude/amjad.
# Port 3079 is registered in the vault PORT_REGISTRY (apps.amjad-cyber). Loopback only;
# the Cloudflare tunnel 587fd4ea reaches it. ./site is a clone of origin/main that
# sync.sh keeps current, so the daily refresh commits need no rebuild.
name: amjad

services:
  web:
    image: nginxinc/nginx-unprivileged:1.30.6-alpine
    container_name: amjad
    restart: unless-stopped
    network_mode: bridge
    ports:
      - "127.0.0.1:3079:8080"
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
