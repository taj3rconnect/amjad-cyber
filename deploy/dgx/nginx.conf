server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # The tunnel terminates TLS, so redirects must stay relative.
    absolute_redirect off;

    gzip on;
    gzip_min_length 1024;
    gzip_types application/javascript application/json application/manifest+json text/css;

    # Revalidate everything so a daily refresh shows at once, at the edge and in browsers.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # The repo robots.txt blocks all crawlers, but Cloudflare's managed robots.txt puts
    # "Allow: /" ahead of it for this zone. This header keeps the site out of search.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # .git lives in the mounted clone. Never serve dotfiles.
    location ~ /\. {
        return 404;
    }

    # In the repo but not part of the site.
    location ~ ^/(deploy|docker)(/|$) {
        return 404;
    }

    location ~ ^/(Dockerfile|docker-compose\.yml|CLAUDE\.md)$ {
        return 404;
    }

    # The repo manifest is scoped to the GitHub Pages path. Rewrite it here so the
    # shared file, and so the Pages site, stays unchanged.
    location = /manifest.json {
        sub_filter '/amjad-cyber/' '/';
        sub_filter_once off;
        sub_filter_types application/json;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
