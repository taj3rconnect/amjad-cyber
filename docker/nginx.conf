server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Keep redirects relative so they survive the host port mapping.
    absolute_redirect off;

    gzip on;
    gzip_min_length 1024;
    gzip_types application/javascript application/json application/manifest+json text/css;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The manifest scope and start_url expect the GitHub Pages path.
    location = / {
        return 302 /amjad-cyber/;
    }

    location = /amjad-cyber {
        return 301 /amjad-cyber/;
    }

    location /amjad-cyber/ {
        index index.html;
        try_files $uri $uri/ =404;
    }

    # The image build needs this folder, but it is not part of the site.
    location ^~ /amjad-cyber/docker/ {
        return 404;
    }

    location = /amjad-cyber/sw.js {
        add_header Cache-Control "no-cache";
    }

    # Stubs for the Ask Dad Worker. Progress stays in this browser's localStorage.
    location = /amjad-cyber/__local/state {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"epoch":"0","items":{},"events":[]}';
    }

    location = /amjad-cyber/__local/history {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '[]';
    }

    location = /amjad-cyber/__local/visit {
        return 204;
    }

    location ~ ^/amjad-cyber/__local/(chat|interview|stt)$ {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 503 '{"error":"Not available in the local Docker copy."}';
    }
}
