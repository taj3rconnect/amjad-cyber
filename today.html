<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Today in AI & Cyber · Amjad</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0b1b3f"><link rel="icon" href="favicon.png">
<style>body{margin:0;font:16px/1.6 Inter,system-ui,sans-serif;background:#f6f8ff;color:#33415c}header{position:sticky;top:0;background:#0b1b3f;padding:12px 16px}header a{color:#fff;font-weight:700;text-decoration:none}main{max-width:760px;margin:0 auto;padding:16px}.it{background:#fff;border:1px solid #e3e8f7;border-radius:16px;padding:18px;margin:14px 0}.tp{background:#eef2ff;color:#4f46e5;border-radius:999px;padding:2px 10px;font-weight:700;font-size:13px}h1,h2{font-family:system-ui;color:#0b1b3f}.mut{color:#6b7590;font-size:14px}</style></head>
<body><header><a href="./">← Amjad's IAM Career Path</a></header><main><h1>Today in AI &amp; Cyber</h1><p class="mut">One item a day. Newest first.</p><div id="L">Loading…</div></main>
<script>const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));fetch('today.json?'+Date.now()).then(r=>r.json()).then(d=>{L.innerHTML=d.items.map(t=>`<div class="it"><span class="tp">${E(t.product)}</span> <span class="mut">${E(t.date)}</span><h2>${E(t.headline)}</h2><p>${E(t.explanation)}</p><p><b>Why it matters:</b> ${E(t.why)}</p>${t.video?`<p><a href="https://www.youtube.com/watch?v=${E(t.video)}" target="_blank" rel="noopener">▶ ${E(t.video_title)}</a></p>`:''}<p class="mut">Source: <a href="${E(t.source)}" target="_blank" rel="noopener">${E(t.source_label)}</a></p></div>`).join('')})</script>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js')</script></body></html>
